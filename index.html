<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cie Ultahhh</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="loading-screen">
        <h1>Cie Ultahhh</h1>
        <p class="subtitle">A world shaped with love, just for you...</p>
        <p class="wait">sabar dikit yaak :3✨</p>
    </div>

    <div id="question-modal" class="hidden">
        <div class="modal-content">
            <p>Selamat datang di umur "Diatas 20" Club, mau lanjut gaa?</p>
            <div class="buttons">
                <button id="btn-yes">Of course 😍</button>
                <button id="btn-no">No way 🙄</button>
            </div>
        </div>
    </div>

    <div id="click-hint" class="hidden">
        <h3>✨ Tap the screen to explode ✨</h3>
    </div>

    <div id="canvas-container"></div>

    <script src="script.js"></script>
</body>
</html>
